# Render Blueprint (free plan, no card): the FastAPI backend (ledger in SQLite on the ephemeral
# filesystem) and the Next.js
# frontend. Create it from the Render dashboard: New > Blueprint > this repo.
# Values marked sync: false are secrets; Render asks for them when the Blueprint is created.
services:
  - type: web
    name: agent-receipts-api
    runtime: python
    plan: free               # spins down after ~15 min idle (~1 min cold start); no disk
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker: the ledger is SQLite and the demo rate limit is in memory.
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        # Ephemeral: resets on every restart, spin-down and redeploy. Staged receipts reload at startup.
        value: sqlite:///./agent_receipts.db
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # Never file with PayPal from the hosted demo; filing happens only locally (recording-prep sitting).
      - key: FILING_ENABLED
        value: "false"
      - key: DISPUTE_AUTO_FILE
        value: "false"
      # Demo cost guard on /shop, scenario runs and dispute resolve.
      - key: RATE_LIMIT_PER_MINUTE
        value: "3"
      - key: RATE_LIMIT_PER_DAY
        value: "150"
      # APP_BASE_URL is not set: the backend falls back to RENDER_EXTERNAL_URL, its public URL.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_VAULT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      # Set after registering the webhook in the PayPal developer dashboard. Until then the
      # webhook route answers 503.
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: agent-receipts-web
    runtime: node
    plan: free               # spins down when idle; first load takes ~1 min
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Free web services can't receive private-network traffic, so use the API's public URL,
      # e.g. https://agent-receipts-api.onrender.com (set after the first deploy, then redeploy:
      # rewrites are fixed at build time).
      - key: BACKEND_URL
        sync: false
